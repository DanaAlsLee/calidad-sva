  if(editing){r.creado=editing.creado||r.creado;r.editado=Date.now();if(r.agenda)r.hecho=editing.agenda===r.agenda?!!editing.hecho:false;await db.collection("calls").doc(editing.id).set(r)}else await save(r);editing=null;form();view=r.agenda?"ag":"my";render()};
}
async function save(r){const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);r.id=id;
 const{id:_,...d}=r;await db.collection("calls").doc(id).set(d)}
async function patch(c,d){await db.collection("calls").doc(c.id).update(d)}

function card(c,sup){
 const d=el("div","card row "+(c.venta?"v":"n"));
 const h=el("h3");const a=el("a","tel",c.tel);a.href="tel:"+c.tel;h.append(c.nombre+" · ",a);d.append(h);
 const t=el("p");[[c.venta?"VENTA":"NO VENTA",c.venta?"t-v":"t-n"],[c.dir,c.dir==="IN"?"t-in":"t-out"]].forEach(([x,k])=>t.append(el("span","tag "+k,x)));
 if(c.venta&&c.producto)t.append(el("span","tag t-s",c.producto));if(!c.venta&&c.pacto)t.append(el("span","tag t-s",c.pacto));d.append(t);
 d.append(el("p",0,"📅 "+fmtF(c.fecha)+(sup?" · 👤 "+c.asesor:"")));
 if(c.venta){d.append(el("p",0,"🔧 "+(c.instalacion?"Instalación: "+fmtD(c.instalacion)+" · ":"")+"Cliente Nº "+c.cliente));if(c.servicios&&c.servicios.length)d.append(el("p",0,"📦 Servicios: "+c.servicios.join(", ")));if(c.svas&&c.svas.length)d.append(el("p",0,"➕ SVAS: "+c.svas.join(", ")))}
 if(c.caso){const cs=CASOS.find(x=>x.k===c.caso);if(cs){const p=el("p",0,"📧 BO: "+cs.n);const b=el("button","g","Reenviar mail");b.style.cssText="margin-left:8px;padding:4px 10px";b.onclick=()=>mailTo(cs,c.casoData||{},c.asesor);p.append(b);d.append(p)}}
 if(c.clienteRA)d.append(el("p",0,"🧾 RA/Sugerencia cargada en cliente Nº "+c.clienteRA));
 if(c.agenda)d.append(el("p",0,(c.hecho?"✔ Re-llamada hecha: ":"⏰ Re-llamar: ")+fmt(c.agenda)));
 if(c.obs)d.append(el("p",0,"💬 "+c.obs));
 if(!sup&&c.asesor===me){const b=el("button","g","✏ Editar");b.style.cssText="margin-top:6px;padding:6px 12px";b.onclick=()=>{view="new";form(c);render()};d.append(b)}
 return d}
function list(box,arr,sup){box.textContent="";if(!arr.length){box.append(el("div","empty","Todavía no hay llamadas registradas."));return}
 const k=el("div","kpi");[["Total",arr.length],["Ventas",arr.filter(c=>c.venta).length],["No venta",arr.filter(c=>!c.venta).length]].forEach(([l,n])=>{const x=el("div");x.append(el("b",0,n),l);k.append(x)});
 k.style.marginBottom="12px";box.append(k);arr.forEach(c=>box.append(card(c,sup)))}
function agenda(){const box=$("#v-ag");box.textContent="";
 const a=mine().filter(c=>c.agenda&&!c.hecho).sort((x,y)=>x.agenda.localeCompare(y.agenda));
 const hoy=a.filter(c=>c.agenda.slice(0,10)<=today()),prox=a.filter(c=>c.agenda.slice(0,10)>today());
 const sec=(t,arr)=>{box.append(el("h3",0,t));if(!arr.length)box.append(el("div","empty","Sin llamadas pendientes 🎉"));arr.forEach(c=>{const d=card(c);if(c.agenda.slice(0,10)<today())d.classList.add("late");const b=el("button","w","✔ Marcar como llamado");b.onclick=()=>patch(c,{hecho:true});d.append(b);box.append(d)})};
 sec("📞 Para llamar hoy (y atrasadas)",hoy);sec("🗓 Próximos días",prox)}
function team(){const box=$("#v-team");box.textContent="";
 const s=el("select");s.append(new Option("Todos los asesores",""));TEAM.forEach(n=>s.append(new Option(n,n)));s.value=team.f||"";
 const b=el("button","w g","⬇ Descargar CSV");box.append(s);
 const body=el("div");box.append(body);box.append(b);
 const arr=()=>calls.filter(c=>!s.value||c.asesor===s.value).sort((a,b)=>(b.fecha||"").slice(0,10).localeCompare((a.fecha||"").slice(0,10))||(b.creado||0)-(a.creado||0));
 const draw=()=>{team.f=s.value;list(body,arr(),true)};s.onchange=draw;draw();
 b.onclick=async()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',H=["Asesor","Fecha","IN/OUT","Teléfono","Nombre","Venta","Instalación","Cliente","Producto","Servicios","SVAS","Motivo","Cliente RA/Sugerencia","Agenda","Observaciones"];
  const rows=arr().map(c=>[c.asesor,c.fecha,c.dir,c.tel,c.nombre,c.venta?"Sí":"No",c.instalacion,c.cliente,c.producto,(c.servicios||[]).join("/"),(c.svas||[]).join("/"),c.pacto,c.clienteRA,c.agenda,c.obs].map(q).join(","));
  const csv="\ufeff"+[H.join(","),...rows].join("\n");
  try{const dl=await claude.use("downloads");if(dl)return void await dl.save({filename:"team_lee_llamadas.csv",data:csv})}catch(e){}
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="team_lee_llamadas.csv";a.click()}}

function mailBody(cs,d,who){const L=cs.f.map(f=>"- "+f+": "+(d[f]||"")).join("\n");return L+"\n\n(Recordá adjuntar print/contrato/comprobantes si corresponde)\n\nAsesor/a: "+who}
function mailTo(cs,d,who){const sub=cs.subj?(d.__subj||"error de portal o CRM"):cs.s;
 const a=document.createElement("a");a.href="mailto:"+BO_MAIL+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(mailBody(cs,d,who));a.click()}
function noteBox(l,t){const n=el("div","note"),b=el("b",0,l);n.append(b,t);return n}
function boPanel(){
 const w=el("div","hide"),sel=el("select");sel.append(new Option("Elegí el caso",""));CASOS.forEach(c=>sel.append(new Option(c.n,c.k)));
 const box=el("div");let cur=null,vals={},ck=null,ins={};w.append(el("label",0,"Caso de consulta a BO"),sel,box);
 const api={el:w,caso:()=>cur,data:()=>({...vals}),chk:null,reset(){sel.value="";draw()},set(k,d){sel.value=k;draw();Object.entries(d).forEach(([f,v])=>{if(ins[f]){ins[f].value=v;vals[f]=v}})}};
 function draw(){box.textContent="";cur=CASOS.find(c=>c.k===sel.value)||null;vals={};ins={};api.chk=null;if(!cur)return;
  box.append(noteBox("Recordá:"," "+cur.note));
  if(cur.subj){const i=el("input");i.placeholder="error de portal o CRM";i.oninput=()=>vals.__subj=i.value;ins.__subj=i;box.append(fld("Asunto (nombre del error)",i))}
  cur.f.forEach(f=>{const i=el("input");i.oninput=()=>vals[f]=i.value;ins[f]=i;box.append(fld(f,i))});
  if(cur.chk){const l=el("label");l.style.textTransform="none";const c=el("input");c.type="checkbox";c.style.cssText="width:auto;margin-right:8px";l.append(c,cur.chk);box.append(l);api.chk=()=>c.checked}
  const r=el("div","two");const m=el("button",0,"📧 Generar mail"),cp=el("button","g","📋 Copiar texto");
  m.type=cp.type="button";m.style.marginTop=cp.style.marginTop="12px";
  m.onclick=()=>mailTo(cur,vals,me);
  cp.onclick=async()=>{try{await navigator.clipboard.writeText("Asunto: "+(cur.subj?(vals.__subj||"error de portal o CRM"):cur.s)+"\n\n"+mailBody(cur,vals,me));cp.textContent="✔ Copiado"}catch(e){cp.textContent="No se pudo copiar"}};
  r.append(m,cp);box.append(r)}
 sel.onchange=draw;return api}
const res={d:today().slice(0,8)+"01",h:today(),a:""};
function bars(t,m,col){const box=el("div","card");box.append(el("b",0,t));const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)box.append(el("div","empty","Sin datos"));const mx=e.length?e[0][1]:1;
 e.forEach(([k,v])=>{const r=el("div","br");const b=el("div","bar");b.style.width=(v/mx*60)+"%";if(col)b.style.background=col;r.append(el("span",0,k),b,el("span",0,v));box.append(r)});return box}
function resumen(){const box=$("#v-res");box.textContent="";const sup=me===SUP;
 const c=el("div","card"),d=inp("r_d","date"),h=inp("r_h","date");d.value=res.d;h.value=res.h;
 const two=el("div","two");two.append(fld("Desde",d),fld("Hasta",h));c.append(two);
 let sa=null;if(sup){sa=el("select");sa.append(new Option("Todos los asesores",""));TEAM.forEach(n=>sa.append(new Option(n,n)));sa.value=res.a;c.append(fld("Asesor/a",sa))}
 const out=el("div");box.append(c,out);
 const draw=()=>{res.d=d.value;res.h=h.value;if(sa)res.a=sa.value;out.textContent="";
  const a=calls.filter(x=>(sup?(!res.a||x.asesor===res.a):x.asesor===me)&&(!res.d||(x.fecha||"").slice(0,10)>=res.d)&&(!res.h||(x.fecha||"").slice(0,10)<=res.h));
  const v=a.filter(x=>x.venta),n=a.filter(x=>!x.venta),cv=a.length?Math.round(v.length/a.length*100):0;
  const k=el("div","kpi");[["Llamadas",a.length],["Ventas",v.length],["No venta",n.length],["Conversión",cv+"%"]].forEach(([l,q])=>{const x=el("div");x.append(el("b",0,q),l);k.append(x)});
  k.style.marginBottom="12px";out.append(k);
  const cnt=(arr,f)=>{const m={};arr.forEach(x=>[].concat(f(x)||[]).forEach(y=>m[y]=(m[y]||0)+1));return m};
  out.append(bars("Ventas por producto",cnt(v,x=>x.producto||"Solo SVA / sin producto principal"),"var(--ok)"),bars("Servicios vendidos",cnt(v,x=>x.servicios),"var(--in)"),bars("SVAS vendidos",cnt(v,x=>x.svas),"var(--pr)"),bars("Motivos de no venta",cnt(n,x=>x.pacto),"var(--no)"),bars("IN / OUT",cnt(a,x=>x.dir),"var(--in)"));
  if(sup&&!res.a)out.append(bars("Ventas por asesor",cnt(v,x=>x.asesor),"var(--ok)"))};
 d.onchange=h.onchange=draw;if(sa)sa.onchange=draw;draw()}
</script></body></html>
